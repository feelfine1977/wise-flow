name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  STORYBOOK_DISABLE_TELEMETRY: '1'
jobs:
  quality:
    name: Static and architecture checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm run check:workflows
      - run: npm run test:tooling
      - name: Production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node --input-type=module -e "import p from './package.json' with {type:'json'}; if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw Error('Tag and package version differ');"
  unit:
    name: Unit and component tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {node: [22, 24]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '${{ matrix.node }}', cache: npm}
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-coverage-node-${{ matrix.node }}
          path: |
            reports/
            coverage/
          retention-days: 14
          if-no-files-found: warn
  package:
    name: Installed package (${{ matrix.node }}, React ${{ matrix.react }}, ${{ matrix.browser }})
    needs: [quality, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {node: 22, react: 18.3.1, types: 18, browser: chromium}
          - {node: 24, react: 19.2.8, types: 19, browser: chromium}
          - {node: 24, react: 19.2.8, types: 19, browser: firefox}
          - {node: 24, react: 19.2.8, types: 19, browser: webkit}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '${{ matrix.node }}', cache: npm}
      - run: npm ci
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:package
        env:
          FLOW_REACT_VERSION: '${{ matrix.react }}'
          FLOW_REACT_TYPES: '${{ matrix.types }}'
          FLOW_BROWSER: '${{ matrix.browser }}'
      - run: npm run check:budgets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: packed-flow-node-${{ matrix.node }}-react-${{ matrix.types }}-${{ matrix.browser }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
  browser:
    name: Browser accessibility and keyboard
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run storybook:build
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-accessibility
          path: |
            test-results/
            playwright-report/
            reports/
          retention-days: 14
          if-no-files-found: warn
  visual:
    name: Strict Linux visual regression
    needs: quality
    runs-on: ubuntu-24.04
    # The image the Linux baselines were captured in (tests/visual/baseline-provenance.json);
    # it brings the browser and its fonts, so nothing is installed on top of it.
    container:
      image: mcr.microsoft.com/playwright@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run test:visual -- --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-diagnostics-linux
          path: |
            test-results/
            playwright-report/
            reports/
          retention-days: 14
          if-no-files-found: warn
  gate:
    name: CI passed
    if: always()
    needs: [quality, unit, package, browser, visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every lane, including skipped and cancelled dependencies
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)) { if(job.result!=="success") { console.error(name+": "+job.result); process.exitCode=1; } }'
