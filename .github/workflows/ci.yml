name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:package
        id: package
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (steps.package.outcome == 'success' || steps.package.outcome == 'failure') }}
        with:
          name: packed-flow-node-${{ matrix.node }}
          path: artifacts/
          if-no-files-found: error
  visual:
    # Match the baseline OS and lockfile's Playwright/Chromium. Never record here.
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Strict visual regression (missing or changed snapshots fail)
        run: npm run test:visual -- --update-snapshots=none
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diagnostics-linux
          path: test-results/
          if-no-files-found: ignore
