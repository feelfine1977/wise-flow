name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  visual:
    # Screenshot baselines are recorded per platform. Until Linux baselines
    # are committed, this job records them and publishes them as an artifact
    # instead of failing; commit the artifact's files to make the job assert.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Visual regression (assert when Linux baselines exist, else record)
        run: |
          if ls tests/visual/__screenshots__/*/*-linux.png >/dev/null 2>&1; then
            npm run test:visual
          else
            echo "No Linux baselines committed yet: recording them."
            npm run test:visual -- --update-snapshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines-linux
          path: |
            tests/visual/__screenshots__
            test-results
          if-no-files-found: ignore
