<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The strict visual lane's fonts on Linux. The Playwright configuration hands
  this file to the browser as FONTCONFIG_FILE, so the map's first font name,
  system-ui, and the generic sans are drawn in Liberation Sans wherever the
  lane runs: the Playwright image and Playwright's installation of the
  browser's system packages both provide it, with a bold face and digits of one width. Without this file the
  image's default font for system-ui is WenQuanYi Zen Hei, which has no bold.
  The rules come before the system configuration, so its aliases and
  fallbacks follow Liberation Sans instead of replacing it.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
